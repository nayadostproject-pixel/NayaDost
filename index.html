<!DOCTYPE html>
<html lang="en"><head>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NYD Miner - Theme 4 GameFi</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700;800&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--purple:#1a0833; --purple2:#3d0f8f; --orange:#ff7a1a; --orange2:#ffae00; --card:#2a1155; --green:#22ff88;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0; background:linear-gradient(135deg,#5a18c9 0%,#2a0a5c 40%,#ff6a00 100%); background-attachment:fixed; font-family:'Inter',sans-serif; color:#fff; min-height:100vh;}
.app{max-width:420px; margin:0 auto; padding:12px 14px 90px;}
.header{display:flex; justify-content:space-between; align-items:center; padding:6px 4px;}
.logo{font-family:'Fredoka'; font-size:28px; font-weight:700; color:#ffd86a; text-shadow:0 0 10px #ff7a1a;}
.coin-hero{width:120px; height:120px; margin:0 auto; background:radial-gradient(circle at 30% 30%,#fff7a0,#ffcc00 30%,#ff8a00 70%); border-radius:50%; border:4px solid #fff; display:flex; align-items:center; justify-content:center; font-family:'Fredoka'; font-size:42px; color:#5a2a00; box-shadow:0 0 30px rgba(255,170,0,0.8),0 10px 0 #c45200; position:relative; animation:float 3s ease-in-out infinite;}
.card-main{background:linear-gradient(180deg,#3e1a8a,#2a1155); border:2px solid #7a4dff; border-radius:22px; padding:14px; box-shadow:0 0 20px rgba(122,77,255,0.5); margin-top:14px;}
.mining-active{color:#22ff88; font-family:'Fredoka'; font-size:22px; font-weight:700;}
.mining-nyd{font-family:'Fredoka'; font-size:38px; font-weight:800;}
.mining-nyd span{font-size:20px; color:#ffae00;}
.sub{font-size:13px; opacity:0.8; color:#ffae7a;}
.level-row{display:flex; align-items:center; gap:10px; margin-top:12px; background:rgba(0,0,0,0.3); border-radius:12px; padding:8px 10px;}
.progress{flex:1; height:10px; background:#1a0833; border-radius:10px; overflow:hidden;}
.progress i{display:block; height:100%; background:linear-gradient(90deg,#ff7a1a,#ffae00); width:65%;}
.btn-claim{width:100%; border:0; padding:14px; border-radius:25px; font-family:'Fredoka'; font-size:18px; font-weight:800; background:linear-gradient(90deg,#ff7a1a,#ffae00); color:#fff; border:2px solid #fff; box-shadow:0 5px 0 #c45200; margin-top:14px;}
.nav{position:fixed; bottom:10px; left:50%; transform:translateX(-50%); width:92%; max-width:400px; background:rgba(26,8,51,0.95); border:2px solid #7a4dff; border-radius:20px; display:grid; grid-template-columns:repeat(5,1fr); height:70px;}
.nav button{background:none; border:0; color:#8ea5dc; font-family:'Fredoka'; font-size:10px;}
.nav button.active{color:#ffae00;}
.nav button span{display:block; font-size:20px;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
</style>
</head><body>
<div class="app">
<div class="header"><div class="logo">NYD</div><div style="background:rgba(0,0,0,0.3); padding:6px 10px; border-radius:20px; font-size:11px; border:1px solid #ffae00;">● READY</div></div>

<div class="card-main" style="text-align:center;">
<div style="color:#ffae7a; letter-spacing:2px; font-size:11px;">TOTAL BALANCE</div>
<div class="mining-nyd" id="bal">11.8845 <span>NYD</span></div>
<div class="coin-hero">NYD</div>
<div class="mining-active">⛏️ Mining Active</div>
<div class="sub">0.20 TH/s • +0.0005 NYD/sec</div>
<button class="btn-claim" onclick="claim()">CLAIM REWARD</button>
</div>

<div class="level-row"><div style="font-size:20px;">⚡</div><div style="flex:1;"><div style="font-family:Fredoka;">Level 7 Miner</div><div class="sub">Next: Level 8 in 1,240 NYD</div><div class="progress" style="margin-top:5px;"><i></i></div></div></div>

<div class="card-main"><div style="font-family:Fredoka;">🚀 Daily Tasks</div><div class="level-row"><div>📋</div><div style="flex:1;">Check-in Daily<br><span style="color:#ffae00; font-size:11px;">+25 NYD</span></div><button style="background:#7a4dff; border:0; color:#fff; padding:6px 12px; border-radius:12px;">Go</button></div></div>

</div>
<div class="nav">
<button class="active"><span>⛏️</span>Mine</button>
<button><span>📋</span>Tasks</button>
<button><span>⚡</span>Miners</button>
<button><span>👥</span>Friends</button>
<button><span>👤</span>Profile</button>
</div>
<script>
let b=11.8845;
function claim(){ b+=0.5; document.getElementById('bal').innerHTML=b.toFixed(4)+' <span>NYD</span>'; }
if(window.Telegram && Telegram.WebApp){Telegram.WebApp.ready(); Telegram.WebApp.expand();}
</script>
</body></html>
