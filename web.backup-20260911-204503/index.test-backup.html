<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NayaDost Mining</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#020817;color:white;font-family:Arial,sans-serif}
.app{max-width:430px;min-height:100vh;margin:auto;padding:15px;background:linear-gradient(180deg,#061b38,#020817)}
.logo{font-size:22px;font-weight:900;color:#22e5ff;text-align:center;margin:10px}
.card{background:#071a35;border:1px solid #087cff;border-radius:18px;padding:18px;margin:12px 0;text-align:center}
.balance{font-size:30px;font-weight:900;color:#22e5ff;margin:10px}
.coin{width:170px;height:170px;margin:25px auto;border-radius:50%;display:grid;place-items:center;font-size:42px;font-weight:900;background:radial-gradient(circle,#42efff,#145bff 45%,#4212b8);border:5px solid #8fffff;box-shadow:0 0 30px #087cff,0 0 70px #4012bd}
button{border:0;border-radius:25px;padding:14px;width:90%;color:white;font-weight:900;background:linear-gradient(90deg,#5b1cff,#a51cff,#087cff)}
</style>
</head>
<body>
<div class="app">
<div class="logo">NYD • NayaDost</div>
<div class="card">
<div>ASSETS</div>
<div class="balance">11.8845 NYD</div>
<div>POOL WALLET</div>
</div>
<div class="card">
<div class="coin">N</div>
<button>START MINING</button>
</div>
</div>
</body>
</html>
