name = "nayadost-app"
main = "worker.js"
compatibility_date = "2026-09-13"
workers_dev = true

# Create a D1 database first:
#   npx wrangler d1 create naya-dost-db
# Then replace DATABASE_ID below with the returned database_id.
[[d1_databases]]
binding = "DB"
database_name = "naya-dost-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
APP_URL = "https://nayadost-app.nayadost-db.workers.dev"
OFFICIAL_CHANNEL = "@NYDEarn_Official"
