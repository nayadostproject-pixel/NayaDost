services:
  - type: web
    name: nayadost-3
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DB_DIR
        value: /var/data
    autoDeployTrigger: commit
    disk:
      name: nyd-data
      mountPath: /var/data
      sizeGB: 1
