<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NayaDost Private Admin</title>
<style>
body{font-family:system-ui;background:#050b18;color:#fff;margin:0;padding:18px}
.wrap{max-width:1100px;margin:auto}.card{background:#0b1830;border:1px solid #2453a8;border-radius:14px;padding:16px;margin:12px 0;overflow:auto}
input,button{padding:10px;border-radius:8px;border:1px solid #315eac;background:#08152b;color:#fff}
button{background:#7134ff;cursor:pointer}table{width:100%;border-collapse:collapse;font-size:12px}
td,th{border-bottom:1px solid #1b3768;padding:8px;text-align:left;vertical-align:top}.addr{word-break:break-all}
.ok{color:#24e58e}.bad{color:#ff6688}.muted{opacity:.7}
</style>
</head>
<body>
<div class="wrap">
<h1>🔐 NayaDost Private Admin</h1>
<div class="card">
<input id="key" type="password" placeholder="Admin Key" autocomplete="off">
<button onclick="load()">Load</button>
<p id="msg" class="muted">Private admin only.</p>
</div>
<div class="card"><h2>Withdrawals</h2><div id="wd">Enter admin key.</div></div>
<div class="card"><h2>Users</h2><div id="users"></div></div>
</div>
<script>
let KEY='';
async function load(){
  KEY=document.getElementById('key').value;
  if(!KEY)return alert('Enter Admin Key');
  const r=await fetch('/admin',{headers:{'x-admin-key':KEY}});
  const j=await r.json();
  if(!r.ok)return alert(j.error||'Unauthorized');
  document.getElementById('msg').textContent='Admin access granted ✓';
  document.getElementById('wd').innerHTML=
  '<table><tr><th>ID</th><th>User</th><th>Amount</th><th>Burn</th><th>Net</th><th>Address</th><th>Status</th><th>Action</th></tr>'+
  (j.withdrawals||[]).map(w=>'<tr><td>'+w.id+'</td><td>'+w.username+'<br>'+w.telegram_id+
  '</td><td>'+w.amount+'</td><td>'+w.burn+'</td><td>'+w.net+'</td><td class="addr">'+w.address+
  '</td><td>'+w.status+'</td><td>'+(w.status==='Pending'?
  '<button onclick="act('+w.id+',\\'Approved\\')">Approve</button> <button onclick="act('+w.id+',\\'Rejected\\')">Reject</button>':'—')+
  '</td></tr>').join('')+'</table>';
  document.getElementById('users').innerHTML=
  '<table><tr><th>ID</th><th>Telegram</th><th>Referral</th><th>Wallet</th><th>Balance</th><th>Verified</th><th>Refs</th><th>Level</th></tr>'+
  (j.users||[]).map(u=>'<tr><td>'+u.id+'</td><td>'+u.telegram_id+'<br>@'+(u.username||'')+
  '</td><td>'+u.referral_code+'<br>from '+(u.referrer_code||'—')+'</td><td class="addr">'+
  (u.wallet_address||'—')+'</td><td>'+Number(u.balance||0).toFixed(4)+'</td><td>'+
  (u.verified?'Yes':'No')+'</td><td>'+u.referrals+'</td><td>'+u.miner_level+'</td></tr>').join('')+'</table>';
}
async function act(id,status){
  const note=prompt('Admin note (optional)')||'';
  const r=await fetch('/admin/withdraw/'+id,{
    method:'POST',headers:{'Content-Type':'application/json','x-admin-key':KEY},
    body:JSON.stringify({status,note})
  });
  const j=await r.json();
  if(!r.ok)return alert(j.error||'Action failed');
  load();
}
</script>
</body>
</html>
